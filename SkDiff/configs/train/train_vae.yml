model:
  name: vae
  coord_dim: 3
  hidden_dim: 64
  latent_dim: 32
  norm_type: layer

train:
  seed: 2026
  batch_size: 64
  num_workers: 32
  pin_memory: True
  max_iters: 500000
  val_freq: 10000
  max_grad_norm: 50.0
  use_amp: True
  optimizer:
    type: adamw
    lr: 1.e-4
    weight_decay: 1.e-8
    beta1: 0.99
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.8
    patience: 1000
    min_lr: 1.e-5
  kl_beta: 1.e-8

dataset:
  use_rotate: false
  use_tag: false
  train_file: /root/autodl-fs-data3/Articulation-XL2.0/train_meta.json
  val_file: /root/autodl-fs-data3/Articulation-XL2.0/val_meta.json
